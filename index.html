<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucky Hangar</title>
    <style>
      html, body { margin: 0; background: #0b0614; }
      * { box-sizing: border-box; }
    </style>
    <script type="module" crossorigin src="./assets/index-wdxPGvLr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DUZbqh2z.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- The game's browser has no dev tools: show uncaught errors on the page instead. -->
    <div id="page-errors" style="display:none;position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:#3a1418;color:#ffd7d7;font:12px/1.4 monospace;padding:8px 12px;white-space:pre-wrap;z-index:99999"></div>
    <script>
      (function () {
        function show(msg) {
          var box = document.getElementById("page-errors");
          if (!box) return;
          box.style.display = "block";
          box.textContent += (box.textContent ? "\n" : "") + "Error: " + msg;
        }
        window.addEventListener("error", function (e) { show(e.message + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "")); });
        window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || String(e.reason)); });
      })();
    </script>
  </body>
</html>
